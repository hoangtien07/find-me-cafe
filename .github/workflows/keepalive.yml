name: keepalive
# Keeps the Render free-tier instance awake: it sleeps after ~15 min idle.
# GitHub scheduled workflows can run late under load, so a ping may land
# after the idle window — the service still wakes on the next request.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Render free wake takes ~50s: each attempt gets 120s and curl retries
      # through the wake window (502/503/504 and timeouts are retried with -f).
      - run: curl -fsS --retry 3 --retry-delay 15 --retry-max-time 300 --max-time 120 https://find-me-cafe.onrender.com/api/health
