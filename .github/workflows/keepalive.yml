name: keepalive
# Keeps the Render free-tier instance awake: it sleeps after ~15 min idle.
# GitHub scheduled workflows can run late under load, so a ping may land
# after the idle window — the service still wakes on the next request.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 2 --max-time 30 https://find-me-cafe.onrender.com/api/health
